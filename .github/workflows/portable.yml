name: Portable core and agent rules
on:
  push:
    paths-ignore:
      - 'prototype/**'
  pull_request:
    paths-ignore:
      - 'prototype/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Use project Yarn version
        run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: yarn install --frozen-lockfile
      - run: yarn verify:portable
